name: Publish Daily AI News

on:
  schedule:
    # 6 a.m. Pacific target with retries for delayed or failed runs, across DST.
    # The generator skips runs before 6 a.m. and editions already published today.
    - cron: '0 13-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ainews-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Research and prepare the issue
        run: node scripts/generate-ainews.mjs
      - name: Validate Astro build
        run: |
          npm install --no-package-lock
          npm run build
      - name: Publish issue to the site
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ainews-latest.json src/data/ainews-archive/ public/images/
          if git diff --cached --quiet; then
            echo "The edition is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish AI News daily edition"
          git push origin HEAD:main
