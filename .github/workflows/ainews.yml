name: Publish Daily AI News

on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-ainews.mjs'
      - '.github/workflows/ainews.yml'

permissions:
  contents: write

concurrency:
  group: ainews-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify the OpenAI API key
        id: api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. Add it under repository Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Research and prepare the issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-ainews.mjs
      - name: Publish issue to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ainews-latest.json src/data/ainews-archive/
          if git diff --cached --quiet; then
            echo "The edition is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish AI News daily edition"
          git push origin HEAD:main
