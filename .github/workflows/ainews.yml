name: Publish Daily AI News

on:
  schedule:
    # Run at 13:00 and 14:00 UTC; automatic runs publish only at 6 a.m. America/Los_Angeles.
    # This covers daylight and standard time. Manual dispatch can run on demand.
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-ainews.mjs'
      - '.github/workflows/ainews.yml'

permissions:
  contents: write

concurrency:
  group: ainews-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Research and prepare the issue
        run: node scripts/generate-ainews.mjs
      - name: Publish issue to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ainews-latest.json src/data/ainews-archive/ public/images/
          if git diff --cached --quiet; then
            echo "The edition is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Publish AI News daily edition"
          git push origin HEAD:main
